<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#111418" />
    <meta
      name="description"
      content="Print per-person order labels from an orders PDF to a NIIMBOT B1 over Bluetooth."
    />
    <title>Order Labels</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="css/app.css" />
    <script src="vendor/niimbluelib.js"></script>
  </head>
  <body>
    <header class="appbar">
      <h1>Order Labels</h1>
      <div class="appbar-actions">
        <button type="button" id="printer-button" class="pill" aria-haspopup="dialog">
          <span class="dot" id="printer-dot" aria-hidden="true"></span>
          <span id="printer-label">Not connected</span>
        </button>
        <button type="button" id="settings-button" class="icon-button" aria-haspopup="dialog" aria-label="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path
              d="M12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Zm7.4-2.6.1-.9-.1-.9 1.9-1.5-1.9-3.2-2.3.8a7.2 7.2 0 0 0-1.6-.9l-.4-2.3H9.9l-.4 2.3c-.6.2-1.1.5-1.6.9l-2.3-.8-1.9 3.2 1.9 1.5-.1.9.1.9-1.9 1.5 1.9 3.2 2.3-.8c.5.4 1 .7 1.6.9l.4 2.3h4.2l.4-2.3c.6-.2 1.1-.5 1.6-.9l2.3.8 1.9-3.2-1.9-1.5Z"
            />
          </svg>
        </button>
      </div>
    </header>

    <main>
      <section class="card" aria-labelledby="source-heading">
        <h2 id="source-heading"><span class="step">1</span> Orders PDF</h2>
        <label class="dropzone" id="dropzone">
          <input type="file" id="file-input" accept="application/pdf,.pdf" />
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" class="dropzone-icon">
            <path d="M12 3v11m0 0 4-4m-4 4-4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" />
          </svg>
          <span class="dropzone-title">Choose an orders PDF</span>
          <span class="dropzone-hint">or drop one here</span>
        </label>
        <p class="source-summary" id="source-summary" hidden></p>
        <ul class="notes" id="warnings" hidden></ul>
      </section>

      <section class="card" id="select-card" aria-labelledby="select-heading" hidden>
        <h2 id="select-heading"><span class="step">2</span> What to print</h2>

        <div class="field">
          <label for="person-select">Person</label>
          <select id="person-select"></select>
        </div>

        <div class="field">
          <span class="field-label" id="range-label">Range</span>
          <div class="range-row" role="group" aria-labelledby="range-label">
            <label class="range-input">
              <span>From</span>
              <input type="number" id="range-from" min="1" step="1" inputmode="numeric" />
            </label>
            <label class="range-input">
              <span>To</span>
              <input type="number" id="range-to" min="1" step="1" inputmode="numeric" />
            </label>
            <button type="button" id="range-all" class="ghost">All</button>
          </div>
        </div>

        <p class="range-summary" id="range-summary"></p>
        <ol class="queue" id="queue"></ol>
      </section>

      <section class="card" id="preview-card" aria-labelledby="preview-heading" hidden>
        <h2 id="preview-heading"><span class="step">3</span> Preview</h2>
        <div class="preview-frame">
          <canvas id="preview" aria-label="Label preview"></canvas>
        </div>
        <div class="preview-nav">
          <button type="button" id="preview-prev" class="ghost" aria-label="Previous label">&lsaquo;</button>
          <span id="preview-caption" aria-live="polite"></span>
          <button type="button" id="preview-next" class="ghost" aria-label="Next label">&rsaquo;</button>
        </div>
        <p class="preview-meta" id="preview-meta"></p>
      </section>
    </main>

    <div class="printbar" id="printbar" hidden>
      <div class="printbar-progress" id="print-progress" hidden>
        <div class="bar"><div class="bar-fill" id="print-bar-fill"></div></div>
        <span id="print-progress-text">Printing…</span>
      </div>
      <p class="printbar-message" id="print-message" role="status" hidden></p>
      <div class="printbar-actions">
        <button type="button" id="print-button" class="primary">Print</button>
        <button type="button" id="cancel-button" class="ghost danger" hidden>Cancel</button>
      </div>
    </div>

    <dialog id="printer-dialog" class="sheet">
      <form method="dialog" class="sheet-head">
        <h2>Printer</h2>
        <button class="icon-button" aria-label="Close">&times;</button>
      </form>
      <div class="sheet-body">
        <p class="notice" id="bluetooth-notice" hidden></p>
        <dl class="details" id="printer-details" hidden></dl>
        <p class="notice error" id="printer-error" hidden></p>
        <div class="sheet-actions">
          <button type="button" id="connect-button" class="primary">Connect a printer</button>
          <button type="button" id="disconnect-button" class="ghost" hidden>Disconnect</button>
        </div>
        <p class="fineprint">
          Pairing uses the browser's Bluetooth picker. Turn the printer on and keep it nearby — it appears as
          something like <code>B1-XXXX</code>.
        </p>
      </div>
    </dialog>

    <dialog id="settings-dialog" class="sheet">
      <form method="dialog" class="sheet-head">
        <h2>Settings</h2>
        <button class="icon-button" aria-label="Close">&times;</button>
      </form>
      <div class="sheet-body">
        <div class="grid-2">
          <div class="field">
            <label for="set-width">Label width (mm)</label>
            <input type="number" id="set-width" min="5" max="120" step="0.5" inputmode="decimal" />
          </div>
          <div class="field">
            <label for="set-height">Label height (mm)</label>
            <input type="number" id="set-height" min="5" max="200" step="0.5" inputmode="decimal" />
          </div>
          <div class="field">
            <label for="set-margin">Margin (mm)</label>
            <input type="number" id="set-margin" min="0" max="15" step="0.5" inputmode="decimal" />
          </div>
          <div class="field">
            <label for="set-copies">Copies of each</label>
            <input type="number" id="set-copies" min="1" max="20" step="1" inputmode="numeric" />
          </div>
          <div class="field">
            <label for="set-density">Darkness (<span id="set-density-value"></span>)</label>
            <input type="range" id="set-density" min="1" max="5" step="1" />
          </div>
          <div class="field">
            <label for="set-label-type">Label type</label>
            <select id="set-label-type"></select>
          </div>
          <div class="field">
            <label for="set-numbering">Numbering</label>
            <select id="set-numbering">
              <option value="per-person">Restart at 1 for each person</option>
              <option value="continuous">Continuous across the run</option>
            </select>
          </div>
          <div class="field">
            <label for="set-font">Font</label>
            <select id="set-font">
              <option value="sans">Sans</option>
              <option value="mono">Monospace</option>
              <option value="serif">Serif</option>
            </select>
          </div>
        </div>
        <label class="check">
          <input type="checkbox" id="set-bold" />
          <span>Bold names</span>
        </label>
        <p class="notice" id="width-notice" hidden></p>
        <div class="sheet-actions">
          <button type="button" id="settings-reset" class="ghost">Reset to defaults</button>
        </div>
      </div>
    </dialog>

    <script type="module" src="js/app.js"></script>
  </body>
</html>

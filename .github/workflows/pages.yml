name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Run the checks on pull requests too, so a branch is validated before it
  # reaches main. The deploy job below stays on main only.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish. Keyed by
# ref so pull request runs never queue behind a deploy of main.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      # The committed vendor bundles must match package.json, or the deployed
      # app would quietly run a different library version than the repo claims.
      - run: npm run build:vendor
      - name: Check vendor/ is up to date
        run: git diff --exit-code -- vendor/

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
